name: E2E user-flow (harness + provider + Headroom)

# Multi-OS harness matrix test: 3 runner OSes x 6 scenarios
# (claude_code solo / codex solo / opencode solo / hermes solo / pi solo /
#  all = claude+codex+opencode together) = 18 parallel jobs, one per cell.
# Each job reproduces, in user order, the journey of a real install on a
# fresh OS:
#   1. install the harness CLI(s) for that scenario,
#   2. configure them against our provider. Here the provider is a local
#      Anthropic<->OpenAI shim backed by Scaleway Generative
#      (deepseek-v4.1-flash-1017). Headroom's proxy speaks Anthropic, while
#      Scaleway only serves the OpenAI schema, so the shim is what a
#      liteLLM / one-api gateway is in a real stack,
#   3. verify the harness answers (baseline, no Headroom in the loop),
#   4. install the Headroom backend the same way the desktop app does
#      (managed venv + pinned headroom-ai wheel + per-OS requirements lock)
#      and start it as a HEADLESS proxy — no GUI, no WebKit, so it works
#      identically on all three runners,
#   5. re-run the SAME prompts through the Headroom proxy and assert it still
#      works, then read /stats on the proxy to confirm tokens were saved.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Headroom release tag to install (default: latest)"
        required: false
        default: ""

permissions:
  contents: read

env:
  SCALEWAY_BASE_URL: https://api.scaleway.ai/v1
  SCALEWAY_MODEL: deepseek-v4.1-flash-1017
  SHIM_PORT: "4010"
  # Headroom proxy port. The headless proxy speaks Anthropic on this port and
  # /stats + /readyz live here too. (The desktop app's GUI/tray build listens
  # on the same port; nothing GUI is started in these tests.)
  HEADROOM_PORT: "6767"
  HEADROOM_URL: "http://127.0.0.1:6767"

jobs:
  e2e:
    name: "E2E ${{ matrix.runOs }} / ${{ matrix.scenario }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (fresh ubuntu-24.04)
          - { os: ubuntu-24.04,   runOs: linux,   scenario: claude_code }
          - { os: ubuntu-24.04,   runOs: linux,   scenario: codex }
          - { os: ubuntu-24.04,   runOs: linux,   scenario: opencode }
          - { os: ubuntu-24.04,   runOs: linux,   scenario: hermes }
          - { os: ubuntu-24.04,   runOs: linux,   scenario: pi }
          - { os: ubuntu-24.04,   runOs: linux,   scenario: all }
          # Windows (fresh windows-latest)
          - { os: windows-latest, runOs: windows, scenario: claude_code }
          - { os: windows-latest, runOs: windows, scenario: codex }
          - { os: windows-latest, runOs: windows, scenario: opencode }
          - { os: windows-latest, runOs: windows, scenario: hermes }
          - { os: windows-latest, runOs: windows, scenario: pi }
          - { os: windows-latest, runOs: windows, scenario: all }
          # macOS (fresh macos-latest)
          - { os: macos-latest,   runOs: macos,   scenario: claude_code }
          - { os: macos-latest,   runOs: macos,   scenario: codex }
          - { os: macos-latest,   runOs: macos,   scenario: opencode }
          - { os: macos-latest,   runOs: macos,   scenario: hermes }
          - { os: macos-latest,   runOs: macos,   scenario: pi }
          - { os: macos-latest,   runOs: macos,   scenario: all }

    env:
      HEADROOM_DATA_DIR: ${{ matrix.runOs == 'windows' && 'C:\\headroom-data' || '/tmp/headroom-data' }}
      SHIM_URL: "http://127.0.0.1:4010"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 0. resolve the Headroom runtime pin ----------
      - name: Resolve Headroom runtime pin
        id: pin
        run: |
          pin="$(sed -n 's/^pub(crate) const HEADROOM_PINNED_VERSION: &str = "\(.*\)";/\1/p' src-tauri/src/tool_manager.rs)"
          echo "pin=$pin"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
        shell: bash

      # ---------- 1. install the harness(es) for this scenario ----------
      # Installers:
      #   claude_code / codex  -> npm global
      #   opencode             -> official installer (V2 stable; npm global pins V1)
      #   hermes               -> official installer (bash for linux/mac, pwsh on windows)
      #   pi                   -> npm global (Earendil)
      #   all                  -> claude_code + codex + opencode
      - name: Install harness(es)
        run: |
          set -euo pipefail
          install_one() {
            case "$1" in
              claude_code) npm install -g @anthropic-ai/claude-code ;;
              codex)
                npm install -g @openai/codex
                # ensure codex is on PATH (solo npm global is enough on GH runners)
                codex --version >/dev/null 2>&1 || true
                ;;
              opencode)
                # Official installer works on Linux/macOS AND Windows (bash = Git Bash/MINGW detects windows-x64 zip).
                curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path || \
                  curl -fsSL https://opencode.ai/install | bash || \
                  npm install -g opencode-ai || true
                export PATH="$HOME/.opencode/bin:$PATH"
                ;;
              hermes)
                if [ "${{ matrix.runOs }}" = "windows" ]; then
                  powershell -Command "Set-ExecutionPolicy -Scope Process Bypass; iex (irm https://hermes-agent.nousresearch.com/install.ps1)" || true
                else
                  curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --non-interactive || \
                    curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash || true
                fi
                ;;
              pi)
                npm install -g @earendil-works/pi-coding-agent
                ;;
            esac
          }
          if [ "${{ matrix.scenario }}" = "all" ]; then
            for h in claude_code codex opencode; do install_one "$h"; done
          else
            install_one "${{ matrix.scenario }}"
          fi
        shell: bash

      - name: Verify harness(es) on PATH
        run: |
          verify_one() {
            case "$1" in
              claude_code) claude --version ;;
              codex)       codex --version || true ;;
              opencode)
                export PATH="$HOME/.opencode/bin:$PATH"
                opencode --version || true
                ;;
              hermes)
              if [ "${{ matrix.runOs }}" = "windows" ]; then export PATH="$HOME/AppData/Local/hermes/bin:$PATH"; fi
                hermes --version || hermes -V || true
                ;;
              pi)          pi --version || true ;;
            esac
          }
          if [ "${{ matrix.scenario }}" = "all" ]; then
            for h in claude_code codex opencode; do verify_one "$h"; done
          else
            verify_one "${{ matrix.scenario }}"
          fi
        shell: bash

      # ---------- 1.5. set up Python 3.12 (used by setup scripts + proxy) ----------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---------- 2. the provider shim (Anthropic<->OpenAI -> Scaleway) ----------
      - name: Start the provider shim toward Scaleway
        env:
          SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
        run: |
          node scripts/e2e-shim.mjs > "$RUNNER_TEMP/shim.log" 2>&1 &
          echo "SHIM_PID=$!"
          # Robust readiness: retry the models probe for up to ~20s.
          ok=""
          for i in $(seq 1 20); do
            if node -e "fetch('http://127.0.0.1:$SHIM_PORT/v1/models').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1)).then(()=>process.exit(0))"; then
              ok=1; break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::shim did not become ready on :$SHIM_PORT"
            tail -20 "$RUNNER_TEMP/shim.log"
            exit 1
          fi
          echo "shim up"
          tail -5 "$RUNNER_TEMP/shim.log"
        shell: bash

      # ---------- 3. baseline: harness(es) talk to the provider, no Headroom ----------
      # Configures each harness against the shim and runs the same single prompt.
      # Claude needs --model (it defaults to claude-opus-5-5) and a trusted
      # workspace (headless runners are untrusted by default -> claude refuses to
      # answer). Codex needs config.toml with wire_api=responses (the old "chat"
      # value was removed from Codex 0.169+). OpenCode (V2) uses the built-in
      # openai-compatible package for a custom provider. Hermes uses provider
      # "custom" with model.base_url. Pi uses a models.json Anthropic-ish
      # endpoint override.
      - name: Baseline — ${{ matrix.scenario }} against the provider (no Headroom)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline"

          export PATH="$HOME/.opencode/bin:$PATH"
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$PATH"
          if [ "${{ matrix.runOs }}" = "windows" ]; then export PATH="$HOME/AppData/Local/hermes/bin:$PATH"; fi

          # --- per-harness config helper: returns a run command ---
          setup_claude() {
            # Trust this workspace so headless claude will answer.
            python3 - "${{ github.workspace }}" <<'PY'
          import json, os, sys
          root = sys.argv[1].replace("\\", "/")
          p = os.path.expanduser("~/.claude.json")
          try:
              d = json.load(open(p))
          except FileNotFoundError:
              d = {}
          d.setdefault("projects", {})
          d["projects"][root] = {"hasTrustDialogAccepted": True}
          # also add with cp-encoding variants as Claude may use either
          os.makedirs(os.path.dirname(p), exist_ok=True)
          json.dump(d, open(p, "w"), indent=2)
          PY
            export ANTHROPIC_BASE_URL="$SHIM_URL"
            export ANTHROPIC_API_KEY="sk-shim-fake"
          }
          setup_codex() {
            export CODEX_HOME="$RUNNER_TEMP/codex-home"; mkdir -p "$CODEX_HOME"
            cat > "$CODEX_HOME/config.toml" <<CFG
          model = "${{ env.SCALEWAY_MODEL }}"
          model_provider = "e2e"

          [model_providers.e2e]
          name = "E2E shim"
          base_url = "${SHIM_URL}/v1"
          env_key = "OPENAI_API_KEY"
          CFG
            export OPENAI_API_KEY="sk-shim-fake"
          }
          setup_opencode() {
            export OPENCODE_CONFIG="$RUNNER_TEMP/opencode.json"
            cat > "$OPENCODE_CONFIG" <<'PY'
          {"provider": {"e2e": {"name": "E2E shim", "npm": "@ai-sdk/openai-compatible",
            "env": ["E2E_API_KEY"],
            "options": {"baseURL": "${{ env.SHIM_URL }}/v1", "apiKey": "{env:E2E_API_KEY}"},
            "models": {"${{ env.SCALEWAY_MODEL }}": {}}}}}
          PY
            export E2E_API_KEY="sk-shim-fake"
          }
          setup_hermes() {
            if [ "${{ matrix.runOs }}" = "windows" ]; then
              HERMES_HOME="$HOME/AppData/Local/hermes"
            else
              HERMES_HOME="$HOME/.hermes"
            fi
            mkdir -p "$HERMES_HOME"
            cat > "$HERMES_HOME/config.yaml" <<CFG
          model:
            provider: "anthropic"
            default: "${{ env.SCALEWAY_MODEL }}"
            base_url: "$SHIM_URL"
            api_key: "sk-shim-fake"
          approvals:
            mode: "off"
          agent:
            max_turns: 2
          CFG
          }
          setup_pi() {
            mkdir -p "$HOME/.pi/agent"
            cat > "$HOME/.pi/agent/models.json" <<PY
          {"providers": {"anthropic": {"baseUrl": "$SHIM_URL", "apiKey": "sk-shim-fake"}}}
          PY
          }

          run_one() {
            local h="$1" i="$2" base_dir="$3"
            case "$h" in
              claude_code)
                setup_claude
                set +e
                claude -p --model "${{ env.SCALEWAY_MODEL }}" --dangerously-skip-permissions "Reply with the single word OK" > "$base_dir/claude_code_$i.txt" 2>&1
                rc=$?
                set -e
                echo "[claude exit=$rc $(wc -c < "$base_dir/claude_code_$i.txt" 2>/dev/null || echo 0)B]"
                ;;
              codex)
                setup_codex
                set +e
                codex exec --skip-git-repo-check "Reply with the single word OK" > "$base_dir/codex_$i.txt" 2>&1
                rc=$?
                set -e
                echo "[codex exit=$rc $(wc -c < "$base_dir/codex_$i.txt" 2>/dev/null || echo 0)B]"
                ;;
              opencode)
                setup_opencode
                set +e
                opencode run -m "e2e/${{ env.SCALEWAY_MODEL }}" --format default "Reply with the single word OK" > "$base_dir/opencode_$i.txt" 2>&1
                rc=$?
                set -e
                echo "[opencode exit=$rc $(wc -c < "$base_dir/opencode_$i.txt" 2>/dev/null || echo 0)B]"
                ;;
              hermes)
                setup_hermes
                set +e
                hermes -z "Reply with the single word OK" -m "${{ env.SCALEWAY_MODEL }}" --yolo -t safe > "$base_dir/hermes_$i.txt" 2>&1
                rc=$?
                set -e
                echo "[hermes exit=$rc $(wc -c < "$base_dir/hermes_$i.txt" 2>/dev/null || echo 0)B]"
                ;;
              pi)
                setup_pi
                set +e
                pi --print --provider anthropic --model "${{ env.SCALEWAY_MODEL }}" --api-key sk-shim-fake --no-session "Reply with the single word OK" > "$base_dir/pi_$i.txt" 2>&1
                rc=$?
                set -e
                echo "[pi exit=$rc $(wc -c < "$base_dir/pi_$i.txt" 2>/dev/null || echo 0)B]"
                ;;
            esac
          }

          if [ "${{ matrix.scenario }}" = "all" ]; then
            i=0
            for h in claude_code codex opencode; do
              i=$((i+1)); run_one "$h" "$i" "$RUNNER_TEMP/baseline"
              out="$RUNNER_TEMP/baseline/${h}_$i.txt"
              grep -qiE "OK|okay" "$out" || { echo "::error::$h baseline did not return OK"; tail -5 "$RUNNER_TEMP/baseline/err.txt"; exit 1; }
              echo "[baseline $h] OK"
            done
          else
            run_one "${{ matrix.scenario }}" 1 "$RUNNER_TEMP/baseline"
            out="$RUNNER_TEMP/baseline/${{ matrix.scenario }}_1.txt"
            grep -qiE "OK|okay" "$out" || { echo "::error::baseline request did not return OK"; tail -5 "$RUNNER_TEMP/baseline/err.txt"; exit 1; }
            echo "Baseline OK: ${{ matrix.scenario }} reached the provider."
          fi
        shell: bash

      # ---------- 4. install the Headroom headless backend ----------
      # The desktop app installs a managed Python runtime (venv) from:
      #   - src-tauri/python/headroom-{os}-requirements.lock  (pinned deps)
      #   - the pinned headroom-ai wheel (HEADROOM_PINNED_VERSION)
      # We do exactly that here, on bare Python, so the proxy under test is
      # byte-identical to the engine the shipped app would run — but without
      # the Tauri GUI, so no WebKit/EGL/tray matters on any of the 3 OSes.
      - name: Install the Headroom backend (managed venv, per-OS lock + pinned wheel)
        run: |
          set -euo pipefail
          pin="${{ steps.pin.outputs.pin }}"
          test -n "$pin"
          mkdir -p "$HEADROOM_DATA_DIR/headroom/runtime"
          if [ "${{ matrix.runOs }}" = "windows" ]; then
            py="python"
            "$py" -m venv "$HEADROOM_DATA_DIR/headroom/runtime/venv"
            py="$HEADROOM_DATA_DIR/headroom/runtime/venv/Scripts/python.exe"
          else
            py="$HEADROOM_DATA_DIR/headroom/runtime/venv/bin/python"
            python3 -m venv "$HEADROOM_DATA_DIR/headroom/runtime/venv"
          fi
          case "${{ matrix.runOs }}" in
            linux)   lock=src-tauri/python/headroom-linux-requirements.lock ;;
            windows) lock=src-tauri/python/headroom-windows-requirements.lock ;;
            *)       lock=src-tauri/python/headroom-requirements.lock ;;
          esac
          "$py" -m pip install --quiet --only-binary=:all: \
            --find-links https://github.com/gglucass/headroom-desktop/releases/expanded_assets/vendor-wheels-v1 \
            -r "$lock"
          "$py" -m pip install --quiet --no-deps --only-binary=:all: "headroom-ai==$pin"
          "$py" -c "import headroom, sys; print('headroom', headroom.__version__ if hasattr(headroom,'__version__') else 'ok', 'on', sys.platform)"
          echo "backend installed"
        shell: bash

      # ---------- 5. boot the Headroom proxy (headless) toward the shim ----------
      - name: Start Headroom proxy → the shim
        run: |
          set -euo pipefail
          # Isolated HOME so the headless proxy never touches a real user's
          # ~/.headroom (stats, CCR store, compression cache) — the CI proxy
          # writes to $RUNNER_TEMP/hr-home/.headroom instead.
          HEADLESS_HOME="$RUNNER_TEMP/hr-home"
          mkdir -p "$HEADLESS_HOME"
          if [ "${{ matrix.runOs }}" = "windows" ]; then
            hr="$HEADROOM_DATA_DIR/headroom/runtime/venv/Scripts/headroom.exe"
          else
            hr="$HEADROOM_DATA_DIR/headroom/runtime/venv/bin/headroom"
          fi
          echo "HRBIN=$hr"
          # Isolate everything the wheel writes under a CI-only HOME so the
          # proxy can never read or clobber real user state. HEADROOM_HARD_
          # WATCHDOG_SECS=0: the wheel's hard watchdog dumps threads and exits
          # when the interpreter has no work for 90s — on an idle job that
          # killed the proxy mid-test with a bare exit and no log, so disable
          # it here.
          HOME="$HEADLESS_HOME" ANTHROPIC_TARGET_API_URL="$SHIM_URL" OPENAI_TARGET_API_URL="$SHIM_URL" \
            HEADROOM_LOSSLESS=1 \
            HEADROOM_HARD_WATCHDOG_SECS=0 \
            "$hr" proxy --port "$HEADROOM_PORT" --mode token --no-http2 --no-rate-limit \
            > "$RUNNER_TEMP/headroom.log" 2>&1 &
          echo "HR_PID=$!"
          HR_PID=$!
          echo "HR_PID=$HR_PID" >> "$GITHUB_ENV"
          # rapid liveness: dies-nearly-immediately check
          sleep 3
          if ! kill -0 "$HR_PID" 2>/dev/null; then
            echo "::error::Headroom proxy died immediately after launch"
            tail -60 "$RUNNER_TEMP/headroom.log"
            exit 1
          fi
          echo "Headroom proxy process alive on :$HEADROOM_PORT"
        shell: bash

      - name: Wait for Headroom proxy /readyz (point harnesses at 6767)
        run: |
          deadline=$(( $(date +%s) + 240 ))
          ok=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if curl -fsS "http://127.0.0.1:${HEADROOM_PORT}/readyz" >/dev/null 2>&1; then ok=1; break; fi
            if ! kill -0 "$HR_PID" 2>/dev/null; then
              echo "::error::Headroom proxy died during boot"
              tail -80 "$RUNNER_TEMP/headroom.log"; exit 1
            fi
            sleep 5
          done
          [ "$ok" = "1" ] || { echo "::error::Headroom proxy never became ready on :$HEADROOM_PORT"; tail -80 "$RUNNER_TEMP/headroom.log"; exit 1; }
          echo "Headroom proxy ready."
          curl -fsS "http://127.0.0.1:${HEADROOM_PORT}/readyz"; echo
        shell: bash

      # ---------- 6. re-run the same prompts through Headroom ----------
      - name: Re-test through Headroom — multiple prompts
        run: |
          set -euo pipefail
          prompts=(
            "Reply with the single word OK"
            "Explain in one sentence what a memory allocator does"
            "Write a one-line Python function that returns the factorial of n"
            "List three benefits of test automation, one per line"
          )
          export PATH="$HOME/.opencode/bin:$PATH"
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$PATH"
          if [ "${{ matrix.runOs }}" = "windows" ]; then export PATH="$HOME/AppData/Local/hermes/bin:$PATH"; fi
          export ANTHROPIC_BASE_URL="${{ env.HEADROOM_URL }}"
          export OPENAI_BASE_URL="${{ env.HEADROOM_URL }}/v1"
          export HEADROOM_URL="${{ env.HEADROOM_URL }}"
          export ANTHROPIC_API_KEY="sk-headroom"

          # Write harness configs ONCE (flush-left terminators at YAML base
          # indent -> bash sees them at column 0; inside a `case` the YAML
          # indent would unbalance the heredoc and die with
          # "syntax error: unexpected end of file").
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          mkdir -p "$CODEX_HOME"
          cat > "$CODEX_HOME/config.toml" <<CFG
          model = "${{ env.SCALEWAY_MODEL }}"
          model_provider = "e2e"

          [model_providers.e2e]
          name = "E2E via Headroom"
          base_url = "${{ env.HEADROOM_URL }}/v1"
          env_key = "OPENAI_API_KEY"
          CFG

          cat > "$RUNNER_TEMP/opencode.json" <<'PY'
          {"provider": {"e2e": {"name": "E2E via Headroom", "npm": "@ai-sdk/openai-compatible",
            "env": ["E2E_API_KEY"],
            "options": {"baseURL": "${{ env.HEADROOM_URL }}/v1", "apiKey": "{env:E2E_API_KEY}"},
            "models": {"${{ env.SCALEWAY_MODEL }}": {}}}}}
          PY
          export E2E_API_KEY="sk-headroom"

          if [ "${{ matrix.runOs }}" = "windows" ]; then
            export HERMES_HOME="$HOME/AppData/Local/hermes"
          else
            export HERMES_HOME="$HOME/.hermes"
          fi
          mkdir -p "$HERMES_HOME"
          cat > "$HERMES_HOME/config.yaml" <<CFG
          model:
            provider: "anthropic"
            default: "${{ env.SCALEWAY_MODEL }}"
            base_url: "${{ env.HEADROOM_URL }}"
            api_key: "sk-headroom"
          approvals:
            mode: "off"
          agent:
            max_turns: 2
          CFG

          mkdir -p "$HOME/.pi/agent"
          cat > "$HOME/.pi/agent/models.json" <<PY
          {"providers": {"anthropic": {"baseUrl": "${{ env.HEADROOM_URL }}", "apiKey": "sk-headroom"}}}
          PY

          tap() {
            local h="$1" n="$2" prompt="$3"
            case "$h" in
              claude_code)
                ANTHROPIC_BASE_URL="${{ env.HEADROOM_URL }}" ANTHROPIC_API_KEY=sk-headroom \
                claude -p --model "${{ env.SCALEWAY_MODEL }}" --dangerously-skip-permissions "$prompt" \
                  > "$RUNNER_TEMP/resp_${h}_${n}.txt" 2>> "$RUNNER_TEMP/hr_err.txt" || true
                ;;
              codex)
                OPENAI_BASE_URL="${{ env.HEADROOM_URL }}/v1" OPENAI_API_KEY=sk-headroom \
                codex exec --skip-git-repo-check "$prompt" \
                  > "$RUNNER_TEMP/resp_${h}_${n}.txt" 2>> "$RUNNER_TEMP/hr_err.txt" || true
                ;;
              opencode)
                OPENCODE_CONFIG="$RUNNER_TEMP/opencode.json" \
                opencode run -m "e2e/${{ env.SCALEWAY_MODEL }}" --format default "$prompt" \
                  > "$RUNNER_TEMP/resp_${h}_${n}.txt" 2>> "$RUNNER_TEMP/hr_err.txt" || true
                ;;
              hermes)
                hermes -z "$prompt" -m "${{ env.SCALEWAY_MODEL }}" --yolo -t safe \
                  > "$RUNNER_TEMP/resp_${h}_${n}.txt" 2>> "$RUNNER_TEMP/hr_err.txt" || true
                ;;
              pi)
                pi --print --provider anthropic --model "${{ env.SCALEWAY_MODEL }}" \
                  --api-key sk-headroom --no-session "$prompt" \
                  > "$RUNNER_TEMP/resp_${h}_${n}.txt" 2>> "$RUNNER_TEMP/hr_err.txt" || true
                ;;
            esac
          }
          n=0
          if [ "${{ matrix.scenario }}" = "all" ]; then harnesses="claude_code codex opencode"; else harnesses="${{ matrix.scenario }}"; fi
          for h in $harnesses; do
            for prompt in "${prompts[@]}"; do
              n=$((n+1))
              tap "$h" "$n" "$prompt"
              if [ ! -s "$RUNNER_TEMP/resp_${h}_${n}.txt" ]; then
                echo "::error::[$h prompt $n] returned empty through Headroom"
                tail -20 "$RUNNER_TEMP/hr_err.txt" 2>/dev/null || true
                exit 1
              fi
              echo "[$h prompt $n] $(head -c 80 "$RUNNER_TEMP/resp_${h}_${n}.txt")"
            done
          done
          echo "All prompts answered through Headroom."
        shell: bash

      # ---------- 7. token savings + diagnostics ----------
      - name: Read Headroom /stats (token savings evidence)
        run: |
          sleep 2
          echo "--- /stats ---"
          curl -fsS "http://127.0.0.1:${HEADROOM_PORT}/stats" 2>/dev/null | head -c 2000 || echo "(stats not readable)"
          echo
          echo "--- compression summary ---"
          curl -fsS "http://127.0.0.1:${HEADROOM_PORT}/stats" 2>/dev/null \
            | python -c "import json,sys; d=json.load(sys.stdin)['summary']; c=d['compression']; print(json.dumps({'mode': d['mode'], 'requests_compressed': c['requests_compressed'], 'total_tokens_before': c['total_tokens_before'], 'total_tokens_removed': c['total_tokens_removed'], 'avg_compression_pct': c['avg_compression_pct']}, indent=2))" \
            || echo "(could not parse /stats)"
          echo "--- tail headroom.log ---"
          (tail -30 "$RUNNER_TEMP/headroom.log" || true)
        shell: bash

      - name: Upload Headroom log + shim log + responses (diagnostics)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.runOs }}-${{ matrix.scenario }}-diag
          path: |
            ${{ runner.temp }}/headroom.log
            ${{ runner.temp }}/shim.log
            ${{ runner.temp }}/*.txt
            ${{ runner.temp }}/baseline/*.txt
          if-no-files-found: ignore
          retention-days: 30
