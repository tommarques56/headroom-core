name: Release macOS

# Builds the macOS universal DMG for the core-compression fork and attaches it
# to a GitHub release. Ad-hoc signed (no Apple Developer ID configured yet):
# the DMG opens on the build machine's Gatekeeper with a right-click override,
# or you add the APPLE_* secrets later for a signed+notarized build.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-macos:
    name: macOS Universal DMG
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      # Self-hosted account backend (Supabase gateway). Replace with the
      # public URL of your deployment before distributing builds.
      HEADROOM_ACCOUNT_API_BASE_URL: http://127.0.0.1:8090/api/v1
      # Updater: signed against this fork's key; endpoints point at this
      # repo's releases. TAURI_SIGNING_PRIVATE_KEY comes from repo secrets.
      HEADROOM_UPDATER_PUBLIC_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEQxQTRDRDBBREE5NUJENEMKUldSTXZaWGFDczJrMGJFYjdNOEJMVWQ3MlhtdGVhbjJlTkFQRC9jcjlzOTREV245eWs4c1FnRnoK
      HEADROOM_UPDATER_ENDPOINTS: '["https://github.com/tommarques56/headroom-core/releases/latest/download/latest.json"]'
      HEADROOM_SENTRY_DSN: ""
      VITE_SENTRY_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend typecheck and tests
        run: |
          npx tsc --noEmit
          npx vitest run

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --skip against_the_installed_wheel

      - name: Install Apple signing certificate
        # Imports the Apple Development p12 (stored as a repo secret) so the
        # app is signed with a stable Team ID. Ad-hoc signing (no identity)
        # makes macOS TCC forget the ~/Documents grant on every relaunch and
        # re-prompt for Keychain; a stable Apple Development signature fixes
        # both: 1 Documents prompt total, 0 Keychain prompts.
        env:
          APPLE_CERT_P12_B64: ${{ secrets.APPLE_CERT_P12_B64 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
          KEYCHAIN: "${{ runner.temp }}/headroom-signing.keychain-db"
        run: |
          set -euo pipefail
          echo "$APPLE_CERT_P12_B64" | base64 -d > /tmp/cert.p12
          # Create and unlock a dedicated, ephemeral signing keychain so the
          # identity does not linger in the runner's login keychain.
          security create-keychain -p "runnerpass" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "runnerpass" "$KEYCHAIN"
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$APPLE_CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild 2>&1
          security set-key-partition-list -S apple-tool:,apple: -s -k "runnerpass" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          echo "APPLE_SIGNING_IDENTITY=${{ vars.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"
          echo "Identity check:"
          security find-identity -v -p codesigning "$KEYCHAIN" | head -5

      - name: Build the universal app
        run: npx tauri build --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}

      - name: Prepare release assets
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DIST="src-tauri/target/universal-apple-darwin/release/bundle"
          mkdir -p release-assets
          cp "${DIST}/dmg/"*.dmg "release-assets/Headroom_${VERSION}_mac.dmg" 2>/dev/null || true
          cp "${DIST}/macos/"*.app.tar.gz "release-assets/" 2>/dev/null || true
          cp "${DIST}/macos/"*.app.tar.gz.sig "release-assets/" 2>/dev/null || true
          python3 - <<'PYEOF'
          import json, glob, datetime, os
          dist = "src-tauri/target/universal-apple-darwin/release/bundle"
          targz = glob.glob(f"{dist}/macos/*.app.tar.gz")[0]
          sig = open(targz + ".sig").read().strip()
          version = json.load(open("package.json"))["version"]
          tag = os.environ.get("GITHUB_REF_NAME") if os.environ.get("GITHUB_REF_TYPE") == "tag" else f"v{version}"
          url = f"https://github.com/tommarques56/headroom-core/releases/download/{tag}/Headroom.app.tar.gz"
          latest = {
              "version": version,
              "notes": f"Headroom core build {version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "darwin-aarch64": {"signature": sig, "url": url},
                  "darwin-x86_64": {"signature": sig, "url": url},
              },
          }
          with open("release-assets/latest.json", "w") as f:
              json.dump(latest, f, indent=2)
          print("latest.json written for", version, "->", url)
          PYEOF
          ls -la release-assets/

      - name: Delete existing macOS assets from the release
        # Makes re-dispatches idempotent: remove any prior Headroom_*mac /
        # Headroom.app.tar.gz / latest.json artifacts before uploading again.
        # gh release delete-asset needs a tag, so this only runs when the
        # release tag exists (created by the cross-platform job or a tag push).
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          for name in "Headroom_${version}_mac.dmg" "Headroom.app.tar.gz" "Headroom.app.tar.gz.sig" "latest.json"; do
            gh release delete-asset "$tag" "$name" --yes 2>/dev/null || true
          done

      - name: Upload release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          # Workflow_dispatch has no git tag: upload straight to the existing
          # v{VERSION} release (created on the first tag release) instead of
          # softprops/action-gh-release, which aborts without a tag.
          gh release upload "$tag" release-assets/* --clobber --repo "$GITHUB_REPOSITORY" || {
            echo "Release $tag not found; creating it now." >&2
            gh release create "$tag" release-assets/* --title "$tag" --notes "Headroom core build ${version}" --repo "$GITHUB_REPOSITORY"
          }

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: headroom-macos-dmg
          path: release-assets/*.dmg
          retention-days: 30

      - name: Set up Python 3.12 for the smoke test
        # The lock (headroom-requirements.lock) pins cp312 wheel hashes.
        # macos-latest now defaults to a newer python3, which resolves different
        # ABI wheels (e.g. cffi cp315) that fail the pinned hashes. Pin 3.12 so
        # the smoke-test venv selects exactly the wheels the lock was made for.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache-dependency-path: src-tauri/python/headroom-requirements.lock

      - name: Smoke test — boot the built backend headless and wait for /readyz
        # Exercises the backend that the macOS artifact (the universal .app just
        # bundled) would run, in the same headless way llm-request-test.yml
        # does (managed venv + pinned wheel + `headroom proxy`). We deliberately
        # do NOT boot the Tauri GUI here: it needs a logged-in account flow and
        # never answers /readyz in a headless runner. The engine under test is
        # byte-identical (same lock, same pinned headroom-ai wheel, same data
        # dir layout), and the .app bundle existence is already asserted below.
        shell: bash
        env:
          BACKEND_PORT: "6768"
          HEADROOM_DATA_DIR: ${{ runner.temp }}/headroom-smoke
        run: |
          set -euo pipefail

          # The lock (headroom-requirements.lock) is generated for CPython 3.12.
          # macos-latest now ships a newer default python3 (3.15), which makes
          # pip pick ABI wheels (e.g. cffi cp315) that do not match the pinned
          # cp312 hashes. Pin 3.12 so the venv selects exactly the wheels the
          # lock was built against.
          py312="$(command -v python3.12 || true)"
          if [ -n "$py312" ]; then
            echo "using system python3.12: $py312"
          else
            py312="$(command -v python || true)"
            echo "using setup-python python: $py312"
          fi
          [ -n "$py312" ] || { echo "no Python 3.12 available" >&2; exit 1; }
          "$py312" --version

          # The artifact we ship must exist before we call its engine "tested".
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Headroom.app"
          [ -d "$app" ] || { echo "app bundle not found: $app" >&2; exit 1; }
          echo "App bundle present: $app"

          pin="$(sed -n 's/^pub(crate) const HEADROOM_PINNED_VERSION: &str = "\(.*\)";/\1/p' src-tauri/src/tool_manager.rs)"
          test -n "$pin"

          mkdir -p "$HEADROOM_DATA_DIR/headroom/runtime"
          py="$HEADROOM_DATA_DIR/headroom/runtime/venv/bin/python"
          "$py312" -m venv "$HEADROOM_DATA_DIR/headroom/runtime/venv"
          "$py" -m pip install --quiet --only-binary=:all: \
            --find-links https://github.com/gglucass/headroom-desktop/releases/expanded_assets/vendor-wheels-v1 \
            -r src-tauri/python/headroom-requirements.lock
          "$py" -m pip install --quiet --no-deps --only-binary=:all: "headroom-ai==$pin"
          "$py" -c "import headroom; print('headroom', getattr(headroom, '__version__', 'ok'))"

          hr="$HEADROOM_DATA_DIR/headroom/runtime/venv/bin/headroom"
          echo "Bootstrapping headless proxy on :$BACKEND_PORT"
          HOME="$RUNNER_TEMP/hr-home" HEADROOM_LOSSLESS=1 HEADROOM_HARD_WATCHDOG_SECS=0 \
            "$hr" proxy --port "$BACKEND_PORT" --mode token --no-http2 --no-rate-limit \
            > "$RUNNER_TEMP/headroom-smoke.log" 2>&1 &
          hr_pid=$!
          trap 'kill "$hr_pid" 2>/dev/null || true' EXIT
          deadline=$(( $(date +%s) + 240 ))
          ok=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            # A live backend answers HTTP (200 with healthy upstream, or 503
            # with body when only the upstream probe is down — no upstream is
            # configured on this runner). Either proves the engine is up.
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${BACKEND_PORT}/readyz" || true)"
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              ok=1; break
            fi
            if ! kill -0 "$hr_pid" 2>/dev/null; then
              echo "::error::headroom proxy died during boot"
              tail -100 "$RUNNER_TEMP/headroom-smoke.log"
              exit 1
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::backend /readyz never answered on :${BACKEND_PORT}"
            tail -100 "$RUNNER_TEMP/headroom-smoke.log"
            exit 1
          fi
          echo "Backend live — /readyz HTTP $code on :${BACKEND_PORT}"
          curl -s "http://127.0.0.1:${BACKEND_PORT}/readyz" | "$py" -c "import json,sys; d=json.load(sys.stdin); print('readyz:', d.get('ready')); [print(' ', k, v) for k,v in (d.get('checks') or {}).items()]"
          echo "Backend smoke OK"
