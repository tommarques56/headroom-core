name: Install smoke test (fresh OS)

# Proves the shipped release installer works on a *class of machine*, not the
# dev laptop: every job below runs on a fresh, unmodified GitHub-hosted runner
# image (no dev shortcuts, no pre-seeded runtime), downloads the real release
# artifact for that platform, installs it the way an end user would, boots the
# app, waits for its self-installed Python backend to answer /readyz, screenshots
# the GUI, and stores the screenshots as artifacts.
#
# This is not a build job: it validates the *installed artifact* end-to-end.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to test (default: from package.json version)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  define-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}"
          else
            # The latest release tag on the repo.
            echo "tag=$(gh api repos/tommarques56/headroom-core/releases/latest --jq .tag_name)"
          fi | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # macOS — fresh macos runner, mount the DMG, install the .app, boot, screenshot
  # ---------------------------------------------------------------------------
  smoke-macos:
    needs: define-tag
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Resolve tag
        id: tag
        run: |
          echo "tag=${{ needs.define-tag.outputs.tag }}"
          echo "tag=${{ needs.define-tag.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Download DMG release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          # gh release download needs a git worktree for tag resolution; this
          # job never checks out, so fetch the asset through the REST API.
          asset_url="$(gh api "repos/tommarques56/headroom-core/releases/tags/${tag}" \
            --jq '.assets[] | select(.name | test("_mac\\.dmg$")) | .browser_download_url')"
          mkdir -p "$RUNNER_TEMP/installer"
          curl -fsSL -o "$RUNNER_TEMP/installer/headroom.dmg" "$asset_url"
          ls -la "$RUNNER_TEMP/installer"

      - name: Mount the DMG and copy the app into /Applications
        run: |
          DMG="$(ls "$RUNNER_TEMP"/installer/*.dmg | head -1)"
          MOUNT_POINT="$RUNNER_TEMP/mnt"
          mkdir -p "$MOUNT_POINT"
          hdiutil attach "$DMG" -mountpoint "$MOUNT_POINT" -nobrowse
          APP="$(ls -d "$MOUNT_POINT"/*.app | head -1)"
          echo "Found app bundle: $APP"
          cp -R "$APP" /Applications/
          hdiutil detach "$MOUNT_POINT"
          echo "Installed: $(ls -d /Applications/*.app)"

      - name: Launch the app in the background
        run: |
          APP="$(ls -d /Applications/Headroom.app)"
          "$APP/Contents/MacOS/headroom-desktop" > "$RUNNER_TEMP/app.log" 2>&1 &
          echo "APP_PID=$!"

      - name: Wait for the backend /readyz (runtime self-installs on first boot)
        env:
          BACKEND_PORT: "6768"
        run: |
          deadline=$(( $(date +%s) + 1800 ))
          while ! curl -fsS "http://127.0.0.1:${BACKEND_PORT}/readyz" > /dev/null 2>&1; do
            now=$(date +%s)
            if [ "$now" -ge "$deadline" ]; then
              echo "::error::Backend /readyz never answered within 30 min."
              echo "---- app.log ----"; tail -100 "$RUNNER_TEMP/app.log"
              exit 1
            fi
            sleep 10
          done
          echo "Backend is ready on :${BACKEND_PORT}"
          curl -fsS "http://127.0.0.1:${BACKEND_PORT}/readyz"

      - name: Capture GUI screenshot
        run: |
          sleep 5
          screencapture -x "$RUNNER_TEMP/headroom-macos.png"
          ls -la "$RUNNER_TEMP/headroom-macos.png"

      - name: Dump tail of app log for the summary
        run: |
          echo "------------ tail app.log ------------"
          tail -60 "$RUNNER_TEMP/app.log"

      - name: Upload macOS screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-macos
          path: ${{ runner.temp }}/headroom-macos.png
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows — fresh windows runner, silent NSIS install, boot, screenshot
  # ---------------------------------------------------------------------------
  smoke-windows:
    needs: define-tag
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          "tag=${{ needs.define-tag.outputs.tag }}" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Download NSIS setup release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ needs.define-tag.outputs.tag }}"
          $assetUrl = gh api "repos/tommarques56/headroom-core/releases/tags/$tag" `
            --jq '.assets[] | select(.name | test("\\.x64-setup\\.exe$")) | .browser_download_url'
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\installer" | Out-Null
          curl.exe -fsSL -o "$env:RUNNER_TEMP\installer\headroom-setup.exe" $assetUrl
          Get-ChildItem "$env:RUNNER_TEMP\installer"

      - name: Install silently to a normal Program Files path
        shell: pwsh
        run: |
          $setup = Get-ChildItem "$env:RUNNER_TEMP\installer" -Filter '*.exe' | Select-Object -First 1
          Write-Host "Installing $($setup.FullName) ..."
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "setup exit code: $($p.ExitCode)" }
          # NSIS default install dir for Headroom
          if (Test-Path "$env:LOCALAPPDATA\Headroom") {
            Get-ChildItem "$env:LOCALAPPDATA\Headroom"
          } else {
            Get-ChildItem "C:\Program Files\Headroom" -ErrorAction SilentlyContinue
          }

      - name: Launch the app in the background
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Headroom" -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue |
                   Where-Object { $_.Name -like '*headroom*' } | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem "C:\Program Files\Headroom" -Recurse -Filter '*.exe' | Select-Object -First 1 }
          Write-Host "Launching $($exe.FullName)"
          Start-Process -FilePath $exe.FullName -RedirectStandardOutput "$env:RUNNER_TEMP\app.log" -RedirectStandardError "$env:RUNNER_TEMP\app.err.log"

      - name: Wait for the backend /readyz
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(30)
          while ((Get-Date) -lt $deadline) {
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:6768/readyz' -UseBasicParsing -TimeoutSec 10
              if ($r.StatusCode -eq 200) {
                Write-Host 'Backend ready'
                Write-Host $r.Content
                exit 0
              }
            } catch { }
            Start-Sleep -Seconds 10
          }
          Write-Error 'Backend /readyz never answered within 30 min.'
          if (Test-Path "$env:RUNNER_TEMP\app.log") { Get-Content "$env:RUNNER_TEMP\app.log" -Tail 60 }
          exit 1

      - name: Capture GUI screenshot (GDI)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap($b.Width, $b.Height)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\headroom-windows.png")
          $g.Dispose(); $bmp.Dispose()
          Write-Host "Saved screenshot"

      - name: Upload Windows screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-windows
          path: ${{ runner.temp }}/headroom-windows.png
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux — fresh ubuntu runner, xvfb display, extract AppImage, boot, screenshot
  # ---------------------------------------------------------------------------
  smoke-linux:
    needs: define-tag
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve tag
        id: tag
        run: |
          echo "tag=${{ needs.define-tag.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Install headless display + screenshot tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick libfuse2 2>/dev/null || sudo apt-get install -y -qq xvfb imagemagick

      - name: Download AppImage release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          # gh release download needs a git worktree; this job never checks out.
          asset_url="$(gh api "repos/tommarques56/headroom-core/releases/tags/${tag}" \
            --jq '.assets[] | select(.name | test("\\.AppImage$")) | .browser_download_url')"
          mkdir -p "$RUNNER_TEMP/installer"
          curl -fsSL -o "$RUNNER_TEMP/installer/headroom.AppImage" "$asset_url"
          ls -la "$RUNNER_TEMP/installer"
          chmod +x "$RUNNER_TEMP"/installer/*.AppImage

      - name: Launch the app under Xvfb and wait for the backend /readyz
        env:
          BACKEND_PORT: "6768"
        run: |
          APPIMAGE="$(ls "$RUNNER_TEMP"/installer/*.AppImage | head -1)"
          Xvfb :99 -screen 0 1280x800x24 &
          export DISPLAY=:99
          # Extract instead of FUSE-mount (containers may not expose /dev/fuse)
          (cd "$RUNNER_TEMP" && "$APPIMAGE" --appimage-extract >/dev/null 2>&1)
          BIN="$RUNNER_TEMP/squashfs-root/AppRun"
          "$BIN" > "$RUNNER_TEMP/app.log" 2>&1 &
          echo "APP_PID=$!"
          deadline=$(( $(date +%s) + 1800 ))
          while ! curl -fsS "http://127.0.0.1:${BACKEND_PORT}/readyz" > /dev/null 2>&1; do
            now=$(date +%s)
            if [ "$now" -ge "$deadline" ]; then
              echo "::error::Backend /readyz never answered within 30 min."
              echo "---- app.log ----"; tail -100 "$RUNNER_TEMP/app.log"
              exit 1
            fi
            sleep 10
          done
          echo "Backend is ready on :${BACKEND_PORT}"
          curl -fsS "http://127.0.0.1:${BACKEND_PORT}/readyz"

      - name: Capture GUI screenshot via ImageMagick
        env:
          DISPLAY: ":99"
        run: |
          sleep 5
          import -window root "$RUNNER_TEMP/headroom-linux.png"
          ls -la "$RUNNER_TEMP/headroom-linux.png"

      - name: Dump tail of app log
        run: |
          echo "------------ tail app.log ------------"
          tail -60 "$RUNNER_TEMP/app.log"

      - name: Upload Linux screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-linux
          path: ${{ runner.temp }}/headroom-linux.png
          if-no-files-found: error
