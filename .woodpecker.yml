# Woodpecker CI — desktop GUI test matrix.
#
# Unlike GitHub Actions (which runs the headless backend proxy), this pipeline
# runs on NATIVE Woodpecker agents (backend: local) attached to the real GUI
# machines, so every job tests the REAL desktop app window:
#   - launch the Tauri app on the actual OS and assert a window shows
#   - detect desktop harnesses (Claude Desktop, Cursor, ChatGPT) and, when an
#     app is installed, drive the same MCP "Install" path and assert the config
#     file was written
#   - prove compression is working through the app's backend via /stats
#
# Agents are selected by the `os` label (configured per agent), so each job
# lands on the matching native machine (no docker).
#
# See scripts/woodpecker-gui-test.sh for the per-OS driver.

when:
  event: [push, pull_request, manual, cron]

  branch: [main, nov23-backlog, woodpecker-gui-test]

# ---------------------------------------------------------------------------
# GUI smoke + desktop harness detection, per OS (the "test the app button" part)
# ---------------------------------------------------------------------------
gui-test-macos:
  labels:
    os: macos
  steps:
    - name: run-gui-test
      image: woodpeckerci/plugin-docker-buildx # ignored with local backend
      commands:
        - bash ./scripts/woodpecker-gui-test.sh macos

gui-test-linux:
  labels:
    os: linux
  steps:
    - name: run-gui-test
      image: woodpeckerci/plugin-docker-buildx
      commands:
        - bash ./scripts/woodpecker-gui-test.sh linux

gui-test-windows:
  labels:
    os: windows
  steps:
    - name: run-gui-test
      image: woodpeckerci/plugin-docker-buildx
      commands:
        - bash ./scripts/woodpecker-gui-test.sh windows

# ---------------------------------------------------------------------------
# One dedicated test PER desktop harness (when the real app is installed):
# click-Install equivalent → assert the config file the desktop app reads.
# Skipped (PASS "not installed") on agents without the app.
# ---------------------------------------------------------------------------
gui-harness-claude-desktop:
  labels:
    os: macos
  steps:
    - name: claude-desktop-mcp
      image: woodpeckerci/plugin-docker-buildx
      commands:
        - |
          CFG="$HOME/Library/Application Support/Claude/claude_desktop_config.json"
          if [ -d "/Applications/Claude.app" ]; then
            [ -f "$CFG" ] && grep -q "com.extraheadroom.headroom" "$CFG" \
              && echo "PASS claude_desktop MCP configured" \
              || { echo "FAIL claude_desktop MCP missing at $CFG"; exit 1; }
          else
            echo "SKIP claude_desktop not installed ($CFG)"
          fi

gui-harness-cursor:
  labels:
    os: macos
  steps:
    - name: cursor-mcp
      image: woodpeckerci/plugin-docker-buildx
      commands:
        - |
          CFG="$HOME/Library/Application Support/Cursor/mcp.json"
          if [ -d "/Applications/Cursor.app" ]; then
            [ -f "$CFG" ] && grep -q "com.extraheadroom.headroom" "$CFG" \
              && echo "PASS cursor MCP configured" \
              || { echo "FAIL cursor MCP missing at $CFG"; exit 1; }
          else
            echo "SKIP cursor not installed ($CFG)"
          fi

gui-harness-chatgpt-desktop:
  labels:
    os: macos
  steps:
    - name: chatgpt-desktop-mcp
      image: woodpeckerci/plugin-docker-buildx
      commands:
        - |
          CFG="$HOME/.codex/config.toml"
          if [ -d "/Applications/ChatGPT.app" ]; then
            grep -qE '\[mcp_servers\.headroom\]' "$CFG" \
              && echo "PASS chatgpt_desktop MCP configured" \
              || { echo "FAIL chatgpt_desktop MCP missing at $CFG"; exit 1; }
          else
            echo "SKIP chatgpt_app not installed ($CFG)"
          fi
