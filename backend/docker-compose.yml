# Backend account/auth for the desktop app: thin gateway that implements the
# /api/v1/desktop/* contract the Rust client expects, backed by HOSTED Supabase
# (Auth + PostgREST + RLS). There is no local Supabase/Postgres container here
# any more - the gateway talks straight to a hosted project.
#
# Run:
#   cp .env.example ../../.env.local   # or export the SUPABASE_* vars
#   docker compose up -d
# Then point the app at http://127.0.0.1:8090/api/v1 (HEADROOM_ACCOUNT_API_BASE_URL
# at build, or the debug runtime override).
#
# Required secrets (set in your environment or a backend/.env):
#   SUPABASE_URL              e.g. https://dqnyzemgsffawrvojpvn.supabase.co
#   SUPABASE_ANON_KEY         publishable key (Auth signup/login/recovery)
#   SUPABASE_SERVICE_ROLE_KEY service-role key (desktop session store)
#
# To migrate the licensing schema into your hosted project:
#   supabase db push          (from the repo root, after 'supabase link')

services:
  # Gateway implementing the desktop API contract:
  #  - POST desktop/auth/register        -> session envelope (email+password)
  #  - POST desktop/auth/login           -> session envelope (email+password)
  #  - POST desktop/auth/reset_password  -> 200 (sends recovery email)
  #  - POST desktop/auth/verify_code     -> 410 deprecated (OTP retired)
  #  - GET  desktop/account              -> account envelope (Bearer)
  #  - POST desktop/account/activate     -> account envelope (Bearer)
  #  - GET  desktop/config               -> public config (paywallFirst etc.)
  #  - POST desktop/grace/start          -> 200 (funnel noop)
  #  - POST desktop/milestones           -> 200 (noop)
  #  - POST desktop/weekly_limit         -> 200 (noop)
  #  - checkout/billing endpoints        -> stub with upgrade URL
  # Auth is delegated to hosted Supabase Auth; licensing lives in Postgres.
  gateway:
    image: node:22-alpine
    container_name: headroom-gateway
    working_dir: /app
    environment:
      GATEWAY_PORT: "8090"
      # Trial length in days (matches LOCAL_GRACE_PERIOD_HOURS on the client).
      TRIAL_DAYS: "7"
      SUPABASE_URL: ${SUPABASE_URL:-https://dqnyzemgsffawrvojpvn.supabase.co}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    volumes:
      - ./gateway:/app
    ports:
      - "127.0.0.1:8090:8090"
    command: sh -c "npm install --no-audit --no-fund --omit=dev && node server.mjs"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 30
    restart: unless-stopped
